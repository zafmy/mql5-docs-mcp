name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - uses: actions/checkout@v7
        with:
          repository: zafmy/mcp-smoke
          ref: 4302dede30bfa243e4e6d856d030b27d8eeb48d9 # main after mcp-smoke#1
          path: .mcp-smoke
      - run: npm ci
        working-directory: .mcp-smoke
      - run: node .mcp-smoke/dist/index.js -c mcp-smoke.json -- node dist/index.js
